name: Build Userscript

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build.js

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --cached --quiet && exit 0
          git commit -m "build: update userscript"
          git push

      - name: Get version
        id: version
        run: echo "tag=v$(node -p "require('fs').readFileSync('dist/clean-novel-reader.user.js','utf8').match(/@version\s+(\S+)/)[1]")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: "dist/clean-novel-reader.user.js"
          allowUpdates: true
          removeArtifacts: true
